<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSCL 2.2 — Technical Support Call Lab</title>
    <style>
        /* ==========================================================================
           TSCL 2.2 LOCAL STYLING (Zero External Dependencies, Mobile Optimized)
           ========================================================================== */
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --bg-card: rgba(17, 24, 39, 0.9);
            --border-color: rgba(75, 85, 99, 0.4);
            --border-hover: rgba(99, 102, 241, 0.6);
            
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            
            --accent-indigo: #6366f1;
            --accent-indigo-hover: #4f46e5;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-cyan: #06b6d4;
            
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-primary) 60%);
            padding-bottom: 40px;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }

        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            user-select: none;
        }

        .brand-title h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .brand-title p {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-pill {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-pill span { color: var(--accent-amber); }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition-fast);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-indigo), #4338ca);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: var(--accent-indigo-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:active {
            background: #374151;
            transform: scale(0.98);
        }

        .dashboard-hero {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .dashboard-hero h2 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-hero p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 16px;
        }

        .level-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            text-align: left;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: left;
        }

        .menu-btn:active {
            border-color: var(--accent-indigo);
            background: var(--bg-tertiary);
            transform: scale(0.98);
        }

        .menu-btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-indigo);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .call-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .customer-meta {
            display: flex;
            flex-direction: column;
        }

        .customer-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .customer-mood {
            font-size: 0.75rem;
            color: var(--accent-amber);
        }

        .trust-meter-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100px;
        }

        .trust-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid var(--border-color);
        }

        .trust-bar-fill {
            height: 100%;
            background: var(--accent-emerald);
            transition: width 0.3s ease;
        }

        .chat-stream {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chat-bubble {
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            max-width: 90%;
            line-height: 1.45;
            position: relative;
        }

        .chat-bubble.customer {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            color: var(--text-main);
        }

        .chat-bubble.advisor {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.4);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            color: var(--text-main);
        }

        .chat-bubble .speaker-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .choice-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            text-align: left;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .choice-btn:active {
            background: var(--bg-tertiary);
            border-color: var(--accent-indigo);
            transform: scale(0.99);
        }

        .choice-btn .choice-prefix {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-indigo);
            text-transform: uppercase;
        }

        .coaching-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-top: 10px;
        }

        .coaching-box.bad {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .coaching-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coaching-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .results-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .score-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .score-box .s-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .score-box .s-value {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .feedback-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
        }

        .feedback-section h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        .filter-chip {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--accent-indigo);
            color: #fff;
            border-color: var(--accent-indigo);
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .scenario-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scenario-item:active {
            border-color: var(--accent-indigo);
            background: var(--bg-tertiary);
        }

        .scenario-info h5 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .scenario-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .phrase-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .qa-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-amber);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-top: 20px;
            font-size: 0.8rem;
        }

        .qa-panel h3 {
            color: var(--accent-amber);
            margin-bottom: 8px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qa-section-title {
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.72rem;
        }

        .qa-list {
            margin-left: 14px;
            margin-bottom: 8px;
        }

        .disclaimer {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            padding: 10px 20px;
            line-height: 1.4;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <header>
        <div class="brand" onclick="app.handleLogoClick()">
            <div class="brand-logo" title="Click 5 times for Developer QA Panel">TS</div>
            <div class="brand-title">
                <h1>TSCL 2.2</h1>
                <p>Call Lab</p>
            </div>
        </div>
        <div class="header-stats">
            <div class="stat-pill" title="Total XP">⚡ <span id="header-xp">0</span></div>
            <div class="stat-pill" title="Current Streak">🔥 <span id="header-streak">0</span></div>
        </div>
    </header>

    <main id="main-content">
        <!-- Injected via JavaScript -->
    </main>

    <div class="disclaimer">
        TSCL is an independent training simulator. Always follow your employer’s current policies, approved tools, escalation procedures, and official support documentation when handling real customers.
    </div>
</div>

<script>
/* ==========================================================================
   TSCL 2.2 CORE APPLICATION ENGINE (Phase 1.1: QA Edge-Case Corrections)
   ========================================================================== */

const STORAGE_KEYS = {
    profile: 'tscl_v2_profile',
    history: 'tscl_v2_history',
    leaderboard: 'tscl_v2_leaderboard',
    phraseMemory: 'tscl_v2_phrase_memory',
    settings: 'tscl_v2_settings'
};

let gameState = {
    xp: 0,
    streak: 0,
    levelTitle: 'Trainee Advisor',
    completedScenarios: {},
    phraseMemoryCompleted: {},
    recentScenarios: [],
    leaderboard: []
};

let currentSession = {
    mode: 'guided',
    scenario: null,
    currentStepIndex: 0,
    trustStore: 70,
    callHistory: [],
    decisionLog: [],
    scores: {
        empathy: 0,
        acknowledgement: 0,
        reassurance: 0,
        ownership: 0,
        technical: 0,
        safety: 0,
        clarity: 0
    },
    totalChoicesMade: 0,
    callCompleted: false,
    selectedPersonality: null,
    shuffledChoicesMap: {},
    stateFlags: {}
};

let logoClickCount = 0;
let logoClickTimer = null;
let qaPanelVisible = false;

/* ==========================================================================
   DYNAMIC CUSTOMER PERSONALITIES
   ========================================================================== */
const CUSTOMER_PERSONALITIES = [
    {
        id: 'impatient',
        name: 'Impatient / Direct',
        moodMod: -15,
        prefixNote: 'Wanting a fast resolution without unnecessary conversational filler.',
        modifierFn: (choice, trust) => {
            if (choice.text.length < 85 && choice.scores.technical > 80) return { trustDelta: 6, note: 'Appreciated the direct, efficient approach.' };
            if (choice.text.length > 140) return { trustDelta: -10, note: 'Grew impatient with the lengthy phrasing.' };
            return { trustDelta: 0, note: '' };
        }
    },
    {
        id: 'anxious',
        name: 'Anxious / Worried',
        moodMod: -10,
        prefixNote: 'Sounding noticeably worried about data loss, security, or account safety.',
        modifierFn: (choice, trust) => {
            if (choice.scores.reassurance >= 90) return { trustDelta: 8, note: 'Calmed significantly by the reassuring guidance.' };
            if (choice.scores.reassurance < 60) return { trustDelta: -12, note: 'Remained anxious due to insufficient reassurance.' };
            return { trustDelta: 0, note: '' };
        }
    },
    {
        id: 'skeptical',
        name: 'Skeptical / Analytical',
        moodMod: -5,
        prefixNote: 'Questioning technical recommendations and demanding evidence.',
        modifierFn: (choice, trust) => {
            if (choice.scores.technical >= 95) return { trustDelta: 10, note: 'Respected the solid technical explanation.' };
            if (choice.scores.technical < 70) return { trustDelta: -10, note: 'Doubted the vague technical recommendation.' };
            return { trustDelta: 0, note: '' };
        }
    },
    {
        id: 'angry',
        name: 'Frustrated / Angry',
        moodMod: -20,
        prefixNote: 'Mentioning previous failed support attempts and high irritation.',
        modifierFn: (choice, trust) => {
            if (choice.scores.ownership >= 95 && choice.scores.acknowledgement >= 90) return { trustDelta: 12, note: 'De-escalated after feeling heard and taking personal ownership.' };
            if (choice.scores.ownership < 60) return { trustDelta: -15, note: 'Grew angrier at the lack of ownership and defensive tone.' };
            return { trustDelta: 0, note: '' };
        }
    },
    {
        id: 'confused',
        name: 'Confused / Hesitant',
        moodMod: -5,
        prefixNote: 'Struggling to follow complex jargon and requiring simple steps.',
        modifierFn: (choice, trust) => {
            if (choice.scores.clarity >= 90 && choice.text.length < 130) return { trustDelta: 8, note: 'Found the clear, step-by-step instructions easy to follow.' };
            if (choice.scores.clarity < 60) return { trustDelta: -8, note: 'Confused by the overly complex phrasing.' };
            return { trustDelta: 0, note: '' };
        }
    },
    {
        id: 'cooperative',
        name: 'Calm & Cooperative',
        moodMod: 10,
        prefixNote: 'Speaking in a steady, collaborative tone.',
        modifierFn: (choice, trust) => {
            if (choice.scores.empathy >= 80) return { trustDelta: 5, note: 'Responded warmly to the supportive tone.' };
            return { trustDelta: 0, note: '' };
        }
    }
];

/* ==========================================================================
   PHRASE MEMORY EXERCISES
   ========================================================================== */
const PHRASE_MEMORY_EXERCISES = [
    {
        id: 'pm-01',
        category: 'Acknowledgement',
        customerStatement: "I've been trying to sign in for an hour and nothing is working!",
        prompt: "Select the most effective response demonstrating strong acknowledgement:",
        choices: [
            { text: "I understand you've been locked out for an hour. Let's fix this right now.", score: 100, clarity: 95, feedback: "Directly acknowledges the specific duration and frustration without fluff." },
            { text: "Okay, let's reset your password right now.", score: 40, clarity: 80, feedback: "Skips acknowledging the customer's wasted hour and frustration." },
            { text: "I'm sorry you are having issues.", score: 60, clarity: 70, feedback: "Generic apology. Lacks specific acknowledgement of what happened." }
        ]
    },
    {
        id: 'pm-02',
        category: 'Empathy',
        customerStatement: "All my vacation photos disappeared and they aren't backed up anywhere else!",

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

            completeScoringChoices: 0,
            missingScoringChoices: 0,
            completeClarityChoices: 0,
            missingClarityChoices: 0,
            personalityCount: personalities.length,
            answerPositionStats: {
                scenarios: { pos1: 0, pos2: 0, pos3: 0, other: 0, total: 0 },
                phraseMemory: { pos1: 0, pos2: 0, pos3: 0, other: 0, total: 0 }
            }
        }
    };

    // 1. Scenario Integrity
    const scenarioIds = new Set();
    scenarios.forEach((s, sIdx) => {
        if (!s.id) {
            report.criticalErrors.push(`Scenario [index ${sIdx}] is missing an ID.`);
        } else if (scenarioIds.has(s.id)) {
            report.criticalErrors.push(`Duplicate scenario ID found: "${s.id}".`);
        } else {
            scenarioIds.add(s.id);
        }

        if (!s.title || typeof s.title !== 'string' || s.title.trim() === '') {
            report.criticalErrors.push(`Scenario "${s.id || sIdx}" is missing a title.`);
        }

        if (!s.category) {
            report.criticalErrors.push(`Scenario "${s.id || sIdx}" is missing a category.`);
        } else {
            report.informational.categoryCounts[s.category] = (report.informational.categoryCounts[s.category] || 0) + 1;
        }

        if (!s.difficulty) {
            report.criticalErrors.push(`Scenario "${s.id || sIdx}" is missing a difficulty level.`);
        } else if (report.informational.difficultyCounts[s.difficulty] !== undefined) {
            report.informational.difficultyCounts[s.difficulty]++;
        } else {
            report.warnings.push(`Scenario "${s.id}" has non-standard difficulty: "${s.difficulty}".`);
        }

        if (!s.steps || !Array.isArray(s.steps) || s.steps.length === 0) {
            report.criticalErrors.push(`Scenario "${s.id}" has no steps defined.`);
            return;
        }

        const stepIds = new Set();
        const validStepIdSet = new Set(s.steps.map(st => st.id));
        validStepIdSet.add('end-success');
        validStepIdSet.add('end-fail');

        s.steps.forEach((st, stIdx) => {
            if (!st.id) {
                report.criticalErrors.push(`Scenario "${s.id}", step index ${stIdx} is missing a step ID.`);
            } else if (stepIds.has(st.id)) {
                report.criticalErrors.push(`Scenario "${s.id}" has duplicate step ID: "${st.id}".`);
            } else {
                stepIds.add(st.id);
            }

            if (!st.prompt || typeof st.prompt !== 'string' || st.prompt.trim() === '') {
                report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id || stIdx}" is missing a step prompt.`);
            }

            // CORRECTION 1: Only explicitly recognized terminal IDs qualify as terminal steps.
            const isTerminal = st.id === 'end-success' || st.id === 'end-fail';

            if (!isTerminal) {
                if (!st.choices || !Array.isArray(st.choices) || st.choices.length === 0) {
                    report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}" is an ordinary step with missing or empty choices array.`);
                } else {
                    let maxScoreInStep = -1;
                    let bestChoicePos = 0;

                    st.choices.forEach((c, cIdx) => {
                        report.informational.totalChoicesInspected++;
                        let hasCompleteScores = true;
                        let hasCompleteClarity = true;

                        if (!c.text || typeof c.text !== 'string' || c.text.trim() === '') {
                            report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} is missing choice text.`);
                        }

                        if (!c.feedback || typeof c.feedback !== 'string' || c.feedback.trim() === '') {
                            report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} is missing feedback.`);
                        }

                        if (!c.scores || typeof c.scores !== 'object') {
                            report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} is missing the scoring object.`);
                            hasCompleteScores = false;
                        } else {
                            const dims = ['empathy', 'acknowledgement', 'reassurance', 'ownership', 'technical', 'safety'];
                            dims.forEach(dim => {
                                if (c.scores[dim] === undefined || typeof c.scores[dim] !== 'number') {
                                    report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} is missing scoring dimension: "${dim}".`);
                                    hasCompleteScores = false;
                                }
                            });
                        }

                        // CORRECTION 5: Clearly distinguish 6-dimensional scenario scoring vs. clarity scoring completeness
                        if (c.clarity === undefined || typeof c.clarity !== 'number') {
                            hasCompleteClarity = false;
                            report.warnings.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} has missing or invalid clarity value.`);
                        }

                        if (hasCompleteScores) {
                            report.informational.completeScoringChoices++;
                        } else {
                            report.informational.missingScoringChoices++;
                        }

                        if (hasCompleteClarity) {
                            report.informational.completeClarityChoices++;
                        } else {
                            report.informational.missingClarityChoices++;
                        }

                        const choiceScoreSum = (c.scores?.empathy || 0) + (c.scores?.technical || 0) + (c.scores?.safety || 0);
                        if (choiceScoreSum > maxScoreInStep) {
                            maxScoreInStep = choiceScoreSum;
                            bestChoicePos = cIdx + 1;
                        }

                        if (!c.nextStep) {
                            report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} is missing nextStep destination.`);
                        } else if (!validStepIdSet.has(c.nextStep)) {
                            report.criticalErrors.push(`Scenario "${s.id}", Step "${st.id}", Choice ${cIdx} points to invalid nextStep destination: "${c.nextStep}".`);
                        }
                    });

                    report.informational.answerPositionStats.scenarios.total++;
                    if (bestChoicePos === 1) report.informational.answerPositionStats.scenarios.pos1++;
                    else if (bestChoicePos === 2) report.informational.answerPositionStats.scenarios.pos2++;
                    else if (bestChoicePos === 3) report.informational.answerPositionStats.scenarios.pos3++;
                    else report.informational.answerPositionStats.scenarios.other++;

                    const lengths = st.choices.map(c => c.text ? c.text.length : 0);
                    const maxLen = Math.max(...lengths);
                    const minLen = Math.min(...lengths);
                    if (minLen > 0 && maxLen > minLen * 2.8) {
                        report.warnings.push(`Scenario "${s.id}", Step "${st.id}": Answer length imbalance (Max: ${maxLen}, Min: ${minLen}).`);
                    }
                }
            }
        });
    });

    // 2. Phrase Memory Integrity
    const pmIds = new Set();
    phraseExercises.forEach((ex, exIdx) => {
        if (!ex.id) {
            report.criticalErrors.push(`Phrase Memory exercise index ${exIdx} is missing an ID.`);
        } else if (pmIds.has(ex.id)) {
            report.criticalErrors.push(`Duplicate Phrase Memory ID found: "${ex.id}".`);
        } else {
            pmIds.add(ex.id);
        }

        if (!ex.prompt || typeof ex.prompt !== 'string' || ex.prompt.trim() === '') {
            report.criticalErrors.push(`Phrase Memory exercise "${ex.id || exIdx}" is missing a prompt.`);
        }

        if (!ex.choices || !Array.isArray(ex.choices) || ex.choices.length === 0) {
            report.criticalErrors.push(`Phrase Memory exercise "${ex.id || exIdx}" has missing or empty choice array.`);
        } else {
            let optimalPos = 0;
            let optimalCount = 0;

            ex.choices.forEach((c, cIdx) => {
                if (!c.text || typeof c.text !== 'string' || c.text.trim() === '') {
                    report.criticalErrors.push(`Phrase Memory "${ex.id}", Choice ${cIdx} is missing text.`);
                }
                if (!c.feedback || typeof c.feedback !== 'string' || c.feedback.trim() === '') {
                    report.criticalErrors.push(`Phrase Memory "${ex.id}", Choice ${cIdx} is missing feedback.`);
                }
                if (c.score === undefined || typeof c.score !== 'number') {
                    report.criticalErrors.push(`Phrase Memory "${ex.id}", Choice ${cIdx} is missing score value.`);
                } else if (c.score >= 100) {
                    optimalCount++;
                    if (optimalCount === 1) {
                        optimalPos = cIdx + 1;
                    }
                }
            });

            // CORRECTION 4: Detect when no choice has score >= 100 or when multiple choices have score >= 100
            if (optimalCount === 0) {
                report.criticalErrors.push(`Phrase Memory exercise "${ex.id}" has no choice with a score of 100 or higher (no optimal answer).`);
            } else if (optimalCount > 1) {
                report.warnings.push(`Phrase Memory exercise "${ex.id}" has multiple choices (${optimalCount}) with a score of 100 or higher.`);
            }

            report.informational.answerPositionStats.phraseMemory.total++;
            if (optimalPos === 1) report.informational.answerPositionStats.phraseMemory.pos1++;
            else if (optimalPos === 2) report.informational.answerPositionStats.phraseMemory.pos2++;
            else if (optimalPos === 3) report.informational.answerPositionStats.phraseMemory.pos3++;
            else report.informational.answerPositionStats.phraseMemory.other++;
        }
    });

    const scnTotal = report.informational.answerPositionStats.scenarios.total;
    if (scnTotal > 0) {
        const p1Ratio = report.informational.answerPositionStats.scenarios.pos1 / scnTotal;
        if (p1Ratio > 0.6) {
            report.warnings.push(`Positional Imbalance Warning: ${Math.round(p1Ratio * 100)}% of scenario score-based optimal-answer estimates are in Position 1.`);
        }
    }

    // 3. Customer Personality Integrity
    const expectedPersonalities = ['impatient', 'anxious', 'skeptical', 'angry', 'confused', 'cooperative'];
    const foundPersonalityIds = new Set();
    const personalityIdCounts = {};

    personalities.forEach((p, pIdx) => {
        if (!p.id) {
            report.criticalErrors.push(`Personality index ${pIdx} is missing an ID.`);
        } else {
            foundPersonalityIds.add(p.id);
            personalityIdCounts[p.id] = (personalityIdCounts[p.id] || 0) + 1;
            if (personalityIdCounts[p.id] > 1) {
                report.criticalErrors.push(`Duplicate personality ID found: "${p.id}".`);
            }
        }

        if (!p.name || typeof p.name !== 'string') {
            report.criticalErrors.push(`Personality "${p.id || pIdx}" is missing a display name.`);
        }

        if (typeof p.modifierFn !== 'function') {
            report.criticalErrors.push(`Personality "${p.id}" is missing a valid modifierFn function.`);
        } else {
            try {
                const testChoice = { text: "Short test text", scores: { empathy: 90, technical: 95, safety: 100, ownership: 95, reassurance: 90 } };
                const result = p.modifierFn(testChoice, 70);
                if (!result || typeof result !== 'object') {
                    report.criticalErrors.push(`Personality "${p.id}" modifierFn did not return a valid object.`);
                } else {
                    if (result.trustDelta === undefined || typeof result.trustDelta !== 'number' || Number.isNaN(result.trustDelta) || !Number.isFinite(result.trustDelta)) {
                        report.criticalErrors.push(`Personality "${p.id}" modifierFn returned invalid trustDelta (non-numeric, NaN, or Infinity): ${result.trustDelta}`);
                    }
                    if (result.note === undefined || typeof result.note !== 'string') {
                        report.criticalErrors.push(`Personality "${p.id}" modifierFn returned missing or non-string reaction note.`);
                    }
                }
            } catch (e) {
                report.criticalErrors.push(`Personality "${p.id}" modifierFn threw an error during test evaluation: ${e.message}`);
            }
        }
    });

    expectedPersonalities.forEach(expId => {
        if (!foundPersonalityIds.has(expId)) {
            report.criticalErrors.push(`Expected customer personality "${expId}" is missing from CUSTOMER_PERSONALITIES.`);
        }
    });

    return report;
}

/* ==========================================================================
   AUTOMATED DEFECT-INJECTION TEST RUNNER (PHASE 1.1)
   ========================================================================== */
function runQADefectInjectionTests() {
    const results = [];

    // Original 6 tests
    // 1. Duplicate Scenario ID
    try {
        const dupScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        dupScenarios[1].id = dupScenarios[0].id;
        const rep = runDeveloperQAReport(dupScenarios, null, null);
        const caught = rep.criticalErrors.some(err => err.includes('Duplicate scenario ID'));
        results.push({ test: 'Duplicate Scenario ID', passed: caught });
    } catch (e) {
        results.push({ test: 'Duplicate Scenario ID', passed: false, error: e.message });
    }

    // 2. Missing Choice Feedback Field
    try {
        const missingFeedbackScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        delete missingFeedbackScenarios[0].steps[0].choices[0].feedback;
        const rep = runDeveloperQAReport(missingFeedbackScenarios, null, null);
        const caught = rep.criticalErrors.some(err => err.includes('missing feedback'));
        results.push({ test: 'Missing Choice Feedback', passed: caught });
    } catch (e) {
        results.push({ test: 'Missing Choice Feedback', passed: false, error: e.message });
    }

    // 3. Missing Scoring Dimension
    try {
        const missingDimScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        delete missingDimScenarios[0].steps[0].choices[0].scores.empathy;
        const rep = runDeveloperQAReport(missingDimScenarios, null, null);
        const caught = rep.criticalErrors.some(err => err.includes('missing scoring dimension: "empathy"'));
        results.push({ test: 'Missing Scoring Dimension', passed: caught });
    } catch (e) {
        results.push({ test: 'Missing Scoring Dimension', passed: false, error: e.message });
    }

    // 4. Invalid Branch Destination
    try {
        const invalidBranchScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        invalidBranchScenarios[0].steps[0].choices[0].nextStep = 'nonexistent-step-id';
        const rep = runDeveloperQAReport(invalidBranchScenarios, null, null);
        const caught = rep.criticalErrors.some(err => err.includes('points to invalid nextStep destination'));
        results.push({ test: 'Invalid Branch Destination', passed: caught });
    } catch (e) {
        results.push({ test: 'Invalid Branch Destination', passed: false, error: e.message });
    }

    // 5. Phrase Memory Exercise with No Choices
    try {
        const emptyPm = JSON.parse(JSON.stringify(PHRASE_MEMORY_EXERCISES));
        emptyPm[0].choices = [];
        const rep = runDeveloperQAReport(null, emptyPm, null);
        const caught = rep.criticalErrors.some(err => err.includes('has missing or empty choice array'));
        results.push({ test: 'Phrase Memory Empty Choice Array', passed: caught });
    } catch (e) {
        results.push({ test: 'Phrase Memory Empty Choice Array', passed: false, error: e.message });
    }

    // 6. Personality Without Valid Modifier Function
    try {
        const badPers = JSON.parse(JSON.stringify(CUSTOMER_PERSONALITIES));
        badPers[0].modifierFn = 'not-a-function';
        const rep = runDeveloperQAReport(null, null, badPers);
        const caught = rep.criticalErrors.some(err => err.includes('missing a valid modifierFn function'));
        results.push({ test: 'Personality Without Valid Modifier', passed: caught });
    } catch (e) {
        results.push({ test: 'Personality Without Valid Modifier', passed: false, error: e.message });
    }

    // --- New Phase 1.1 Tests ---
    // 7. Ordinary step with empty choices array (must fail)
    try {
        const testScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        testScenarios[0].steps[0].choices = [];
        testScenarios[0].steps[0].id = 'ordinary-step-empty';
        const rep = runDeveloperQAReport(testScenarios, null, null);
        const caught = rep.criticalErrors.some(err => err.includes('is an ordinary step with missing or empty choices array'));
        results.push({ test: 'Ordinary Step with Empty Choices', passed: caught });
    } catch (e) {
        results.push({ test: 'Ordinary Step with Empty Choices', passed: false, error: e.message });
    }

    // 8. Valid terminal step with empty choices (must pass)
    try {
        const testScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        testScenarios[0].steps.push({ id: 'end-success', prompt: 'Success', choices: [] });
        const rep = runDeveloperQAReport(testScenarios, null, null);
        const hasTerminalError = rep.criticalErrors.some(err => err.includes('end-success') || err.includes('is an ordinary step'));
        results.push({ test: 'Valid Terminal Step with Empty Choices', passed: !hasTerminalError });
    } catch (e) {
        results.push({ test: 'Valid Terminal Step with Empty Choices', passed: false, error: e.message });
    }

    // 9. Duplicate personality ID
    try {
        const testPers = JSON.parse(JSON.stringify(CUSTOMER_PERSONALITIES));
        testPers[1].id = testPers[0].id;
        const rep = runDeveloperQAReport(null, null, testPers);
        const caught = rep.criticalErrors.some(err => err.includes('Duplicate personality ID found'));
        results.push({ test: 'Duplicate Personality ID', passed: caught });
    } catch (e) {
        results.push({ test: 'Duplicate Personality ID', passed: false, error: e.message });
    }

    // 10. Personality modifier returning NaN trustDelta
    try {
        const testPers = JSON.parse(JSON.stringify(CUSTOMER_PERSONALITIES));
        testPers[0].modifierFn = () => ({ trustDelta: NaN, note: 'NaN test' });
        const rep = runDeveloperQAReport(null, null, testPers);
        const caught = rep.criticalErrors.some(err => err.includes('returned invalid trustDelta'));
        results.push({ test: 'Personality Modifier NaN trustDelta', passed: caught });
    } catch (e) {
        results.push({ test: 'Personality Modifier NaN trustDelta', passed: false, error: e.message });
    }

    // 11. Phrase Memory exercise with no optimal answer (score < 100 for all)
    try {
        const testPm = JSON.parse(JSON.stringify(PHRASE_MEMORY_EXERCISES));
        testPm[0].choices.forEach(c => c.score = 50);
        const rep = runDeveloperQAReport(null, testPm, null);
        const caught = rep.criticalErrors.some(err => err.includes('has no choice with a score of 100 or higher'));
        results.push({ test: 'Phrase Memory No Optimal Answer', passed: caught });
    } catch (e) {
        results.push({ test: 'Phrase Memory No Optimal Answer', passed: false, error: e.message });
    }

    // 12. Phrase Memory exercise with multiple optimal answers (>1 with score >= 100)
    try {
        const testPm = JSON.parse(JSON.stringify(PHRASE_MEMORY_EXERCISES));
        testPm[0].choices[0].score = 100;
        testPm[0].choices[1].score = 100;
        const rep = runDeveloperQAReport(null, testPm, null);
        const caught = rep.warnings.some(warn => warn.includes('has multiple choices') && warn.includes('with a score of 100 or higher'));
        results.push({ test: 'Phrase Memory Multiple Optimal Answers', passed: caught });
    } catch (e) {
        results.push({ test: 'Phrase Memory Multiple Optimal Answers', passed: false, error: e.message });
    }

    // 13. Missing clarity value
    try {
        const testScenarios = JSON.parse(JSON.stringify(SCENARIOS));
        delete testScenarios[0].steps[0].choices[0].clarity;
        const rep = runDeveloperQAReport(testScenarios, null, null);
        const caught = rep.warnings.some(warn => warn.includes('has missing or invalid clarity value'));
        results.push({ test: 'Missing Clarity Value Warning', passed: caught });
    } catch (e) {
        results.push({ test: 'Missing Clarity Value Warning', passed: false, error: e.message });
    }

    return results;
}

/* ==========================================================================
   LOCALSTORAGE PERSISTENCE
   ========================================================================== */
function loadGameState() {
    try {
        const savedProfile = localStorage.getItem(STORAGE_KEYS.profile);
        if (savedProfile) {
            const parsed = JSON.parse(savedProfile);
            gameState.xp = parsed.xp || 0;
            gameState.streak = parsed.streak || 0;
            gameState.levelTitle = parsed.levelTitle || 'Trainee Advisor';
            gameState.completedScenarios = parsed.completedScenarios || {};
        }

        const savedHistory = localStorage.getItem(STORAGE_KEYS.history);
        if (savedHistory) {
            gameState.recentScenarios = JSON.parse(savedHistory) || [];
        }

        const savedPM = localStorage.getItem(STORAGE_KEYS.phraseMemory);
        if (savedPM) {
            gameState.phraseMemoryCompleted = JSON.parse(savedPM) || {};
        }

        const savedLB = localStorage.getItem(STORAGE_KEYS.leaderboard);
        if (savedLB) {
            gameState.leaderboard = JSON.parse(savedLB) || [];
        } else {
            gameState.leaderboard = [
                { name: 'Alex M.', score: 980, xp: 4500, date: '2026-03-01' },
                { name: 'Jordan T.', score: 920, xp: 3800, date: '2026-03-02' }
            ];
        }
    } catch (e) {
        console.warn('LocalStorage error:', e);
    }
    updateLevelTitle();
}

function saveGameState() {
    try {
        localStorage.setItem(STORAGE_KEYS.profile, JSON.stringify({
            xp: gameState.xp,
            streak: gameState.streak,
            levelTitle: gameState.levelTitle,
            completedScenarios: gameState.completedScenarios
        }));
        localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(gameState.recentScenarios));
        localStorage.setItem(STORAGE_KEYS.phraseMemory, JSON.stringify(gameState.phraseMemoryCompleted));
        localStorage.setItem(STORAGE_KEYS.leaderboard, JSON.stringify(gameState.leaderboard));
    } catch (e) {
        console.warn('Could not save to localStorage:', e);
    }
}

function updateLevelTitle() {
    const xp = gameState.xp;
    if (xp >= 5000) gameState.levelTitle = 'Master Advisor 👑';
    else if (xp >= 3500) gameState.levelTitle = 'Expert Advisor 🌟';
    else if (xp >= 2000) gameState.levelTitle = 'Senior Advisor 🚀';
    else if (xp >= 1000) gameState.levelTitle = 'Advisor 📞';
    else if (xp >= 400) gameState.levelTitle = 'Apprentice 📚';
    else gameState.levelTitle = 'Trainee 🎧';
}

    /* ==========================================================================

       ========================================================================== */
    initSimulator(scenarioId, mode) {
        const scenario = SCENARIOS.find(s => s.id === scenarioId) || SCENARIOS[0];
        const personality = CUSTOMER_PERSONALITIES[Math.floor(Math.random() * CUSTOMER_PERSONALITIES.length)];

        currentSession = {
            mode: mode,
            scenario: scenario,
            currentStepIndex: 0,
            trustStore: 70 + personality.moodMod,
            callHistory: [],
            decisionLog: [],
            scores: {
                empathy: 0,
                acknowledgement: 0,
                reassurance: 0,
                ownership: 0,
                technical: 0,
                safety: 0,
                clarity: 0
            },
            totalChoicesMade: 0,
            callCompleted: false,
            selectedPersonality: personality,
            shuffledChoicesMap: {},
            stateFlags: {}
        };

        scenario.steps.forEach(step => {
            if (step.choices && step.choices.length > 0) {
                currentSession.shuffledChoicesMap[step.id] = shuffleArray(step.choices);
            }
        });

        currentSession.callHistory.push({
            speaker: 'customer',
            text: scenario.customer.opening,
            stepId: 'opening'
        });

        this.renderSimulatorUI();
    },

    renderSimulatorUI() {
        const main = document.getElementById('main-content');
        const s = currentSession.scenario;
        const currentStep = s.steps[currentSession.currentStepIndex];
        const isEnded = currentSession.currentStepIndex >= s.steps.length - 1 || currentSession.callCompleted;
        const choices = currentSession.shuffledChoicesMap[currentStep?.id] || [];

        main.innerHTML = `
            <div class="card">
                <div class="call-header-bar">
                    <div class="customer-meta">
                        <div class="customer-name">${s.customer.name}</div>

                        <div class="trust-bar-bg">

                    ${currentSession.callHistory.map(h => `
                        <div class="chat-bubble ${h.speaker}">

                            ${h.text}
                            ${h.choiceText ? `<div style="margin-top:6px; font-size:0.75rem; color:var(--accent-cyan); font-style:italic;">Selected: "${h.choiceText}"</div>` : ''}
                            ${h.personalityNote ? `<div style="margin-top:4px; font-size:0.72rem; color:var(--accent-amber); font-style:italic;">[${currentSession.selectedPersonality.name} reaction: ${h.personalityNote}]</div>` : ''}
                        </div>
                    `).join('')}
                </div>

                <div id="interaction-area" style="margin-top: 16px;">
                    ${!isEnded && currentStep && choices.length > 0 ? `
                        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">${currentStep.prompt}</div>
                        <div class="choices-area">
                            ${choices.map((choice, idx) => `
                                <button class="choice-btn" onclick="app.makeChoice('${currentStep.id}', ${idx})">
                                    <span class="choice-prefix">Option ${idx + 1}</span>
                                    <span>${choice.text}</span>
                                </button>
                            `).join('')}
                        </div>
                    ` : `
                        <div style="text-align: center; padding: 20px;">
                            <p style="margin-bottom: 14px; font-size: 0.9rem;">Call reached conclusion point.</p>
                            <button class="btn btn-primary" onclick="app.finishCall()">View Post-Call Results</button>
                        </div>
                    `}
                </div>

        `;

        const chatStream = document.getElementById('chat-stream');
        chatStream.scrollTop = chatStream.scrollHeight;
    },

    makeChoice(stepId, shuffledChoiceIndex) {
        if (currentSession.callCompleted) return;

        const currentStep = currentSession.scenario.steps.find(st => st.id === stepId);
        const choices = currentSession.shuffledChoicesMap[stepId];
        const choice = choices[shuffledChoiceIndex];

        currentSession.totalChoicesMade++;

        let pNote = '';
        let personalityTrustDelta = 0;
        if (currentSession.selectedPersonality && currentSession.selectedPersonality.modifierFn) {
            const pResult = currentSession.selectedPersonality.modifierFn(choice, currentSession.trustStore);
            personalityTrustDelta = pResult.trustDelta || 0;
            pNote = pResult.note || '';
        }

        currentSession.decisionLog.push({
            stepPrompt: currentStep.prompt,
            choiceText: choice.text,
            feedback: choice.feedback,
            scores: choice.scores,
            clarity: choice.clarity || 85,
            personalityNote: pNote
        });

        const scores = choice.scores;
        currentSession.scores.empathy += scores.empathy || 0;
        currentSession.scores.acknowledgement += scores.acknowledgement || 0;
        currentSession.scores.reassurance += scores.reassurance || 0;
        currentSession.scores.ownership += scores.ownership || 0;
        currentSession.scores.technical += scores.technical || 0;
        currentSession.scores.safety += scores.safety !== undefined ? scores.safety : 80;
        currentSession.scores.clarity += choice.clarity !== undefined ? choice.clarity : 85;

        const baseTrustDelta = scores.trustDelta || 0;
        currentSession.trustStore = Math.max(0, Math.min(100, currentSession.trustStore + baseTrustDelta + personalityTrustDelta));

        currentSession.callHistory.push({
            speaker: 'advisor',
            text: choice.text,
            stepId: currentStep.id,
            choiceText: choice.text,
            personalityNote: pNote
        });

        if (currentSession.mode === 'guided') {
            this.renderGuidedFeedback(choice, pNote);
        } else {
            this.advanceStep(choice.nextStep);
        }
    },

    renderGuidedFeedback(choice, pNote) {
        const isGood = (choice.scores.empathy || 0) >= 70 && (choice.scores.safety || 80) >= 80;
        const interactionArea = document.getElementById('interaction-area');

        interactionArea.innerHTML = `
            <div class="coaching-box ${isGood ? '' : 'bad'}">
                <div class="coaching-title">
                    <span>${isGood ? '✅ Communication Principle Met' : '⚠️ Communication Opportunity'}</span>
                </div>
                <div class="coaching-text">${choice.feedback} ${pNote ? `<br><strong style="color: var(--accent-amber);">Personality Reaction:</strong> ${pNote}` : ''}</div>
                <button class="btn btn-primary" onclick="app.advanceStep('${choice.nextStep}')">Continue Call →</button>
            </div>
        `;
    },

    advanceStep(nextStepId) {
        if (currentSession.callCompleted) return;

        const s = currentSession.scenario;
        
        if (nextStepId === 'end-success' || nextStepId === 'end-fail' || currentSession.currentStepIndex >= s.steps.length - 1) {
            this.finishCall();
            return;
        }

        const nextIdx = s.steps.findIndex(st => st.id === nextStepId);
        if (nextIdx !== -1) {
            currentSession.currentStepIndex = nextIdx;
            const nextStepObj = s.steps[nextIdx];
            currentSession.callHistory.push({
                speaker: 'customer',
                text: nextStepObj.prompt,
                stepId: nextStepObj.id
            });
        } else {
            currentSession.currentStepIndex++;
            if (currentSession.currentStepIndex >= s.steps.length - 1) {
                this.finishCall();
                return;
            }
        }

        this.renderSimulatorUI();
    },

    /* ==========================================================================
       FINISH CALL & RESULTS
       ========================================================================== */
    finishCall() {
        if (currentSession.callCompleted) return;
        currentSession.callCompleted = true;

        const totalChoices = Math.max(1, currentSession.totalChoicesMade);
        const avgScores = {
            empathy: Math.round(currentSession.scores.empathy / totalChoices),
            acknowledgement: Math.round(currentSession.scores.acknowledgement / totalChoices),
            reassurance: Math.round(currentSession.scores.reassurance / totalChoices),
            ownership: Math.round(currentSession.scores.ownership / totalChoices),
            technical: Math.round(currentSession.scores.technical / totalChoices),
            safety: Math.round(currentSession.scores.safety / totalChoices),
            clarity: Math.round(currentSession.scores.clarity / totalChoices)
        };

        const overallScore = Math.round((avgScores.empathy + avgScores.acknowledgement + avgScores.reassurance + avgScores.ownership + avgScores.technical + avgScores.safety + avgScores.clarity) / 7);
        const xpEarned = Math.max(50, overallScore * 2);

        gameState.xp += xpEarned;
        gameState.streak += 1;

        const s = currentSession.scenario;
        const existingRecord = gameState.completedScenarios[s.id];
        const bestScore = existingRecord ? Math.max(existingRecord.bestScore, overallScore) : overallScore;
        const attempts = existingRecord ? existingRecord.attempts + 1 : 1;

        gameState.completedScenarios[s.id] = {
            bestScore: bestScore,
            attempts: attempts,
            lastPlayed: new Date().toISOString().split('T')[0]
        };

        gameState.recentScenarios = [s.id, ...gameState.recentScenarios.filter(id => id !== s.id)].slice(0, 5);

        gameState.leaderboard.push({
            name: 'You (Advisor)',
            score: overallScore,
            xp: xpEarned,
            date: new Date().toISOString().split('T')[0]
        });
        gameState.leaderboard.sort((a, b) => b.score - a.score);
        gameState.leaderboard = gameState.leaderboard.slice(0, 10);

        updateLevelTitle();
        saveGameState();

        this.navigateTo('results', {
            scenario: s,
            overallScore: overallScore,
            xpEarned: xpEarned,
            avgScores: avgScores,
            trust: currentSession.trustStore,
            history: currentSession.callHistory,
            decisionLog: currentSession.decisionLog,
            mode: currentSession.mode,
            personalityName: currentSession.selectedPersonality.name
        });
    },

                                    ${shuffledChoices.map((c) => {
                                        const originalIndex = ex.choices.indexOf(c);
                                        return `
                                            <button class="btn btn-secondary" style="text-align: left; justify-content: flex-start; font-size: 0.82rem; padding: 10px 14px;" onclick="app.submitPhraseAnswer('${ex.id}', ${originalIndex})">
                                                ${c.text}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                <div id="feedback-${ex.id}" style="margin-top: 10px; font-size: 0.8rem; display: none;"></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    },

    submitPhraseAnswer(exerciseId, originalChoiceIndex) {
        const ex = PHRASE_MEMORY_EXERCISES.find(e => e.id === exerciseId);
        const choice = ex.choices[originalChoiceIndex];
        const isBest = choice.score >= 100;

        const feedbackEl = document.getElementById(`feedback-${exerciseId}`);
        feedbackEl.style.display = 'block';
        feedbackEl.style.padding = '10px';
        feedbackEl.style.borderRadius = 'var(--radius-sm)';
        feedbackEl.style.background = isBest ? 'rgba(16, 185, 129, 0.15)' : 'rgba(244, 63, 94, 0.15)';
        feedbackEl.style.border = isBest ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(244, 63, 94, 0.3)';
        feedbackEl.innerHTML = `<strong>${isBest ? '✅ Optimal Response' : '⚠️ Sub-optimal Response'}</strong><br>${choice.feedback}`;

        if (isBest && !gameState.phraseMemoryCompleted[exerciseId]) {
            gameState.phraseMemoryCompleted[exerciseId] = true;
            gameState.xp += 25;
            updateLevelTitle();
            saveGameState();
            this.renderHeaderStats();

            const card = document.getElementById(exerciseId);
            const badge = card.querySelector('span');
            badge.innerText = 'Completed ✓';
            badge.style.background = 'rgba(16, 185, 129, 0.2)';
            badge.style.color = 'var(--accent-emerald)';
        }
    },

    renderLeaderboardHTML() {
        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Local Leaderboard</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Stored locally on this device/browser.</p>
                    </div>
                    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="app.navigateTo('dashboard')">Back</button>
                </div>

                <div style="overflow-x: auto; margin-top: 10px;">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Advisor</th>
                                <th>Score</th>
                                <th>XP</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${gameState.leaderboard.map((entry, idx) => `
                                <tr>
                                    <td>#${idx + 1}</td>
                                    <td><strong>${entry.name}</strong></td>
                                    <td>${entry.score}%</td>
                                    <td>${entry.xp}</td>
                                    <td>${entry.date}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    },

    renderProgressHTML() {
        const completedCount = Object.keys(gameState.completedScenarios).length;
        const totalScenarios = SCENARIOS.length;
        const pmCompletedCount = Object.keys(gameState.phraseMemoryCompleted).length;

        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Advisor Progress</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Training metrics and milestones.</p>
                    </div>
                    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="app.navigateTo('dashboard')">Back</button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 10px;">
                    <div class="stat-card">
                        <div class="label">Current Rank Title</div>
                        <div class="value" style="color: var(--accent-amber);">${gameState.levelTitle}</div>
                    </div>

                    <div class="stat-card">
                        <div class="label">Total Accumulated XP</div>
                        <div class="value" style="color: var(--accent-cyan);">${gameState.xp} XP</div>
                    </div>

                    <div class="stat-card">
                        <div class="label">Scenarios Completed</div>
                        <div class="value">${completedCount} / ${totalScenarios} (${Math.round((completedCount / totalScenarios) * 100)}%)</div>
                    </div>

                    <div class="stat-card">
                        <div class="label">Phrase Memory Completed</div>
                        <div class="value">${pmCompletedCount} / ${PHRASE_MEMORY_EXERCISES.length}</div>
                    </div>
                </div>
            </div>
        `;
    }
};

document.addEventListener('DOMContentLoaded', () => {
    app.init();
});
</script>
</body>
</html>

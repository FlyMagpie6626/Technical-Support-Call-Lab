<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSCL 2.0 — Technical Support Call Lab</title>
    <style>
        /* ==========================================================================
           TSCL 2.0 LOCAL STYLING (Zero External Dependencies)
           ========================================================================== */
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --bg-card: rgba(17, 24, 39, 0.85);
            --border-color: rgba(75, 85, 99, 0.4);
            --border-hover: rgba(99, 102, 241, 0.6);
            
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            
            --accent-indigo: #6366f1;
            --accent-indigo-hover: #4f46e5;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-cyan: #06b6d4;
            
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-primary) 60%);
            padding-bottom: 40px;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }

        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .brand-title h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .brand-title p {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-pill {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-pill span { color: var(--accent-amber); }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-card);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition-fast);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-indigo), #4338ca);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: var(--accent-indigo-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:active {
            background: #374151;
            transform: scale(0.98);
        }

        .dashboard-hero {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .dashboard-hero h2 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-hero p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 16px;
        }

        .level-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            text-align: left;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: left;
        }

        .menu-btn:active {
            border-color: var(--accent-indigo);
            background: var(--bg-tertiary);
            transform: scale(0.98);
        }

        .menu-btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-indigo);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .call-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .customer-meta {
            display: flex;
            flex-direction: column;
        }

        .customer-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .customer-mood {
            font-size: 0.75rem;
            color: var(--accent-amber);
        }

        .trust-meter-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100px;
        }

        .trust-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid var(--border-color);
        }

        .trust-bar-fill {
            height: 100%;
            background: var(--accent-emerald);
            transition: width 0.3s ease;
        }

        .chat-stream {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chat-bubble {
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            max-width: 90%;
            line-height: 1.45;
            position: relative;
        }

        .chat-bubble.customer {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            color: var(--text-main);
        }

        .chat-bubble.advisor {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.4);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            color: var(--text-main);
        }

        .chat-bubble .speaker-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .choice-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            text-align: left;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .choice-btn:active {
            background: var(--bg-tertiary);
            border-color: var(--accent-indigo);
            transform: scale(0.99);
        }

        .choice-btn .choice-prefix {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-indigo);
            text-transform: uppercase;
        }

        .coaching-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-top: 10px;
        }

        .coaching-box.bad {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .coaching-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coaching-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .results-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .score-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .score-box .s-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .score-box .s-value {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .feedback-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
        }

        .feedback-section h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 12px;
        }

        .filter-chip {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--accent-indigo);
            color: #fff;
            border-color: var(--accent-indigo);
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .scenario-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scenario-item:active {
            border-color: var(--accent-indigo);
            background: var(--bg-tertiary);
        }

        .scenario-info h5 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .scenario-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .phrase-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .disclaimer {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            padding: 10px 20px;
            line-height: 1.4;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <header>
        <div class="brand" onclick="app.navigateTo('dashboard')">
            <div class="brand-logo">TS</div>
            <div class="brand-title">
                <h1>TSCL 2.0</h1>
                <p>Call Lab</p>
            </div>
        </div>
        <div class="header-stats">
            <div class="stat-pill" title="Total XP">⚡ <span id="header-xp">0</span></div>
            <div class="stat-pill" title="Current Streak">🔥 <span id="header-streak">0</span></div>
        </div>
    </header>

    <main id="main-content">
        <!-- Injected via JavaScript -->
    </main>

    <div class="disclaimer">
        TSCL is an independent training simulator. Always follow your employer’s current policies, approved tools, escalation procedures, and official support documentation when handling real customers.
    </div>
</div>

<script>
/* ==========================================================================
   TSCL 2.0 CORE APPLICATION ENGINE (Balanced Lengths & Plausible Distractors)
   ========================================================================== */

const DEBUG_MODE = false;

const STORAGE_KEYS = {
    profile: 'tscl_v2_profile',
    history: 'tscl_v2_history',
    leaderboard: 'tscl_v2_leaderboard',
    phraseMemory: 'tscl_v2_phrase_memory',
    settings: 'tscl_v2_settings'
};

let gameState = {
    xp: 0,
    streak: 0,
    levelTitle: 'Trainee Advisor',
    completedScenarios: {},
    phraseMemoryCompleted: {},
    recentScenarios: [],
    leaderboard: []
};

let currentSession = {
    mode: 'guided',
    scenario: null,
    currentStepIndex: 0,
    trustStore: 70,
    callHistory: [],
    decisionLog: [],
    scores: {
        empathy: 0,
        acknowledgement: 0,
        reassurance: 0,
        ownership: 0,
        technical: 0,
        safety: 0,
        clarity: 0
    },
    totalChoicesMade: 0,
    callCompleted: false,
    selectedPersonality: null
};

/* ==========================================================================
   CUSTOMER PERSONALITY PROFILES
   ========================================================================== */
const CUSTOMER_PERSONALITIES = [
    { id: 'calm', name: 'Calm & Cooperative', moodMod: 10, prefixNote: 'Speaking in a steady, calm tone.' },
    { id: 'anxious', name: 'Anxious / Worried', moodMod: -10, prefixNote: 'Sounding noticeably worried about their data/account.' },
    { id: 'frustrated', name: 'Frustrated', moodMod: -20, prefixNote: 'Slightly impatient due to previous failed attempts.' },
    { id: 'impatient', name: 'Impatient / Direct', moodMod: -15, prefixNote: 'Wanting a fast resolution without unnecessary steps.' },
    { id: 'technical', name: 'Technically Confident', moodMod: 5, prefixNote: 'Familiar with tech terminology and expects precise answers.' },
    { id: 'confused', name: 'Less Confident / Confused', moodMod: -5, prefixNote: 'Struggling to follow technical instructions.' }
];

/* ==========================================================================
   PHRASE MEMORY DATA (Audited for length parity & plausible distractors)
   ========================================================================== */
const PHRASE_MEMORY_EXERCISES = [
    {
        id: 'pm-01',
        category: 'Acknowledgement',
        customerStatement: "I've been trying to sign in for an hour and nothing is working!",
        prompt: "Select the most effective response demonstrating strong acknowledgement:",
        choices: [
            { text: "I understand you've been locked out for an hour. Let's fix this right now.", score: 100, feedback: "Directly acknowledges the specific duration and frustration without fluff." },
            { text: "Okay, let's reset your password right now.", score: 40, feedback: "Skips acknowledging the customer's wasted hour and frustration." },
            { text: "I'm sorry you are having issues.", score: 60, feedback: "Generic apology. Lacks specific acknowledgement of what happened." }
        ]
    },
    {
        id: 'pm-02',
        category: 'Empathy',
        customerStatement: "All my vacation photos disappeared and they aren't backed up anywhere else!",
        prompt: "Choose the best empathetic response:",
        choices: [
            { text: "Well, did you check your Recently Deleted album?", score: 50, feedback: "Technically relevant discovery, but emotionally dismissive of someone panicking over lost memories." },
            { text: "I can imagine how stressful it is to realize your vacation photos are missing. Let's look into this together.", score: 100, feedback: "Validates the emotional stress while taking collaborative ownership." },
            { text: "Don't worry, it's probably just a sync glitch.", score: 70, feedback: "Reassuring, but minimizes the customer's genuine emotional stress prematurely." }
        ]
    },
    {
        id: 'pm-03',
        category: 'Reassurance',
        customerStatement: "Is my bank account compromised because I got a weird pop-up?",
        prompt: "Select the most professional reassurance:",
        choices: [
            { text: "Let's check your security settings together right now so we can verify what's happening.", score: 100, feedback: "Calming, structured, and action-oriented reassurance." },
            { text: "Yes, definitely. Your phone is hacked.", score: 0, feedback: "Unsafe and alarmist. Never cause panic without verification." },
            { text: "Probably not, pop-ups are usually fake.", score: 40, feedback: "Too casual and dismissive of valid security concerns." }
        ]
    },
    {
        id: 'pm-04',
        category: 'Ownership',
        customerStatement: "The last three advisors I spoke with told me different things and nobody fixed it.",
        prompt: "Choose the response that demonstrates strong ownership:",
        choices: [
            { text: "That's not my fault, but let me see what I can do.", score: 30, feedback: "Defensive and shifts blame away from the company." },
            { text: "Let me transfer you to my supervisor.", score: 50, feedback: "Premature escalation without attempting discovery or showing ownership." },
            { text: "I apologize for the conflicting info. I'm taking ownership of your case now to sort this out.", score: 100, feedback: "Rebuilds trust immediately by taking personal responsibility for the customer's journey." }
        ]
    },
    {
        id: 'pm-05',
        category: 'Discovery',
        customerStatement: "My battery drains completely in two hours ever since the update yesterday.",
        prompt: "Select the best discovery question:",
        choices: [
            { text: "Have you tried restarting your phone?", score: 60, feedback: "A standard step, but asks before checking what battery usage stats show." },
            { text: "Let's check Battery settings to see which apps consumed the most power since yesterday.", score: 100, feedback: "Precise discovery targeting root cause analysis before blindly suggesting generic troubleshooting." },
            { text: "You should probably buy a replacement battery.", score: 0, feedback: "Premature and inaccurate recommendation following a software update." }
        ]
    }
];

/* ==========================================================================
   CANONICAL SCENARIO LIBRARY (Audited Choice Lengths & Randomized Positions)
   ========================================================================== */
const SCENARIOS = [
    {
        id: 'acc-01',
        title: 'Apple Account Sign-In Loop',
        category: 'Apple Account & Security',
        difficulty: 'Medium',
        customer: { name: 'Sarah Jenkins', personality: 'anxious', opening: "Hi... I'm locked out of my Apple Account because it keeps looping back to the password screen every time I enter my verification code, and I'm honestly panicking because my work documents are tied to it." },
        steps: [
            {
                id: 'step-1',
                prompt: "Sarah is anxious and worried about her work documents. How do you respond?",
                choices: [
                    {
                        text: "Try restarting your phone and enter the password again.",
                        scores: { empathy: 30, acknowledgement: 20, reassurance: 40, ownership: 40, technical: 50, safety: 70, trustDelta: -10 },
                        feedback: "Too abrupt. Skips empathy and gives generic advice without investigating the loop.",
                        nextStep: 'step-2b'
                    },

/* ==========================================================================
   QA VALIDATION & DEBUG ENGINE (Length & Bias Checks)
   ========================================================================== */
function runContentQAValidation() {
    const report = { totalScenarios: SCENARIOS.length, warnings: [] };
    SCENARIOS.forEach(s => {
        s.steps.forEach(step => {
            if (step.choices && step.choices.length > 0) {
                const lengths = step.choices.map(c => c.text.length);
                const maxLen = Math.max(...lengths);
                const minLen = Math.min(...lengths);
                if (maxLen > minLen * 2.2) {
                    report.warnings.push(`Scenario ${s.id}, step ${step.id}: Significant length variance between choices (Max: ${maxLen}, Min: ${minLen}).`);
                }
            }
        });
    });
    return report;
}

/* ==========================================================================
   LOCALSTORAGE PERSISTENCE
   ========================================================================== */
function loadGameState() {
    try {
        const savedProfile = localStorage.getItem(STORAGE_KEYS.profile);
        if (savedProfile) {
            const parsed = JSON.parse(savedProfile);
            gameState.xp = parsed.xp || 0;
            gameState.streak = parsed.streak || 0;
            gameState.levelTitle = parsed.levelTitle || 'Trainee Advisor';
            gameState.completedScenarios = parsed.completedScenarios || {};
        }

        const savedHistory = localStorage.getItem(STORAGE_KEYS.history);
        if (savedHistory) {
            gameState.recentScenarios = JSON.parse(savedHistory) || [];
        }

        const savedPM = localStorage.getItem(STORAGE_KEYS.phraseMemory);
        if (savedPM) {
            gameState.phraseMemoryCompleted = JSON.parse(savedPM) || {};
        }

        const savedLB = localStorage.getItem(STORAGE_KEYS.leaderboard);
        if (savedLB) {
            gameState.leaderboard = JSON.parse(savedLB) || [];
        } else {
            gameState.leaderboard = [
                { name: 'Alex M.', score: 980, xp: 4500, date: '2026-03-01' },
                { name: 'Jordan T.', score: 920, xp: 3800, date: '2026-03-02' }
            ];
        }
    } catch (e) {
        console.warn('LocalStorage error:', e);
    }
    updateLevelTitle();
}

function saveGameState() {
    try {
        localStorage.setItem(STORAGE_KEYS.profile, JSON.stringify({
            xp: gameState.xp,
            streak: gameState.streak,
            levelTitle: gameState.levelTitle,
            completedScenarios: gameState.completedScenarios
        }));
        localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(gameState.recentScenarios));
        localStorage.setItem(STORAGE_KEYS.phraseMemory, JSON.stringify(gameState.phraseMemoryCompleted));
        localStorage.setItem(STORAGE_KEYS.leaderboard, JSON.stringify(gameState.leaderboard));
    } catch (e) {
        console.warn('Could not save to localStorage:', e);
    }
}

function updateLevelTitle() {
    const xp = gameState.xp;
    if (xp >= 5000) gameState.levelTitle = 'Master Advisor 👑';
    else if (xp >= 3500) gameState.levelTitle = 'Expert Advisor 🌟';
    else if (xp >= 2000) gameState.levelTitle = 'Senior Advisor 🚀';
    else if (xp >= 1000) gameState.levelTitle = 'Advisor 📞';
    else if (xp >= 400) gameState.levelTitle = 'Apprentice 📚';
    else gameState.levelTitle = 'Trainee 🎧';
}

                            ${h.choiceText ? `<div style="margin-top:6px; font-size:0.75rem; color:var(--accent-cyan); font-style:italic;">Selected: "${h.choiceText}"</div>` : ''}
                        </div>
                    `).join('')}
                </div>

                <div id="interaction-area" style="margin-top: 16px;">
                    ${!isEnded && currentStep && currentStep.choices && currentStep.choices.length > 0 ? `
                        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">${currentStep.prompt}</div>
                        <div class="choices-area">
                            ${currentStep.choices.map((choice, idx) => `
                                <button class="choice-btn" onclick="app.makeChoice(${idx})">
                                    <span class="choice-prefix">Option ${idx + 1}</span>
                                    <span>${choice.text}</span>
                                </button>
                            `).join('')}
                        </div>
                    ` : `
                        <div style="text-align: center; padding: 20px;">
                            <p style="margin-bottom: 14px; font-size: 0.9rem;">Call reached conclusion point.</p>
                            <button class="btn btn-primary" onclick="app.finishCall()">View Post-Call Results</button>
                        </div>
                    `}
                </div>
            </div>
        `;

        const chatStream = document.getElementById('chat-stream');
        chatStream.scrollTop = chatStream.scrollHeight;
    },

    makeChoice(choiceIndex) {
        if (currentSession.callCompleted) return;

        const s = currentSession.scenario;
        const currentStep = s.steps[currentSession.currentStepIndex];
        const choice = currentStep.choices[choiceIndex];

        currentSession.totalChoicesMade++;

        currentSession.decisionLog.push({
            stepPrompt: currentStep.prompt,
            choiceText: choice.text,
            feedback: choice.feedback,
            scores: choice.scores
        });

        const scores = choice.scores;
        currentSession.scores.empathy += scores.empathy || 0;
        currentSession.scores.acknowledgement += scores.acknowledgement || 0;
        currentSession.scores.reassurance += scores.reassurance || 0;
        currentSession.scores.ownership += scores.ownership || 0;
        currentSession.scores.technical += scores.technical || 0;
        currentSession.scores.safety += scores.safety !== undefined ? scores.safety : 80;

        currentSession.trustStore = Math.max(0, Math.min(100, currentSession.trustStore + (scores.trustDelta || 0)));

        currentSession.callHistory.push({
            speaker: 'advisor',
            text: choice.text,
            stepId: currentStep.id,
            choiceText: choice.text
        });

        if (currentSession.mode === 'guided') {
            this.renderGuidedFeedback(choice);
        } else {
            this.advanceStep(choice.nextStep);
        }
    },

    renderGuidedFeedback(choice) {
        const isGood = (choice.scores.empathy || 0) >= 70 && (choice.scores.safety || 80) >= 80;
        const interactionArea = document.getElementById('interaction-area');

        interactionArea.innerHTML = `
            <div class="coaching-box ${isGood ? '' : 'bad'}">
                <div class="coaching-title">
                    <span>${isGood ? '✅ Communication Principle Met' : '⚠️ Communication Opportunity'}</span>
                </div>
                <div class="coaching-text">${choice.feedback}</div>
                <button class="btn btn-primary" onclick="app.advanceStep('${choice.nextStep}')">Continue Call →</button>
            </div>
        `;
    },

    advanceStep(nextStepId) {
        if (currentSession.callCompleted) return;

        const s = currentSession.scenario;
        
        if (nextStepId === 'end-success' || nextStepId === 'end-fail' || currentSession.currentStepIndex >= s.steps.length - 1) {
            this.finishCall();
            return;
        }

        const nextIdx = s.steps.findIndex(st => st.id === nextStepId);
        if (nextIdx !== -1) {
            currentSession.currentStepIndex = nextIdx;
            const nextStepObj = s.steps[nextIdx];
            currentSession.callHistory.push({
                speaker: 'customer',
                text: nextStepObj.prompt,
                stepId: nextStepObj.id
            });
        } else {
            currentSession.currentStepIndex++;
            if (currentSession.currentStepIndex >= s.steps.length - 1) {
                this.finishCall();
                return;
            }
        }

        this.renderSimulatorUI();
    },

    /* ==========================================================================
       FINISH CALL & DOUBLE-COMPLETION PROTECTION
       ========================================================================== */
    finishCall() {
        if (currentSession.callCompleted) return;
        currentSession.callCompleted = true;

        const totalChoices = Math.max(1, currentSession.totalChoicesMade);
        const avgScores = {
            empathy: Math.round(currentSession.scores.empathy / totalChoices),
            acknowledgement: Math.round(currentSession.scores.acknowledgement / totalChoices),
            reassurance: Math.round(currentSession.scores.reassurance / totalChoices),
            ownership: Math.round(currentSession.scores.ownership / totalChoices),
            technical: Math.round(currentSession.scores.technical / totalChoices),
            safety: Math.round(currentSession.scores.safety / totalChoices)
        };

        const overallScore = Math.round((avgScores.empathy + avgScores.acknowledgement + avgScores.reassurance + avgScores.ownership + avgScores.technical + avgScores.safety) / 6);
        const xpEarned = Math.max(50, overallScore * 2);

        gameState.xp += xpEarned;
        gameState.streak += 1;

        const s = currentSession.scenario;
        const existingRecord = gameState.completedScenarios[s.id];
        const bestScore = existingRecord ? Math.max(existingRecord.bestScore, overallScore) : overallScore;
        const attempts = existingRecord ? existingRecord.attempts + 1 : 1;

        gameState.completedScenarios[s.id] = {
            bestScore: bestScore,
            attempts: attempts,
            lastPlayed: new Date().toISOString().split('T')[0]
        };

        gameState.recentScenarios = [s.id, ...gameState.recentScenarios.filter(id => id !== s.id)].slice(0, 5);

        gameState.leaderboard.push({
            name: 'You (Advisor)',
            score: overallScore,
            xp: xpEarned,
            date: new Date().toISOString().split('T')[0]
        });
        gameState.leaderboard.sort((a, b) => b.score - a.score);
        gameState.leaderboard = gameState.leaderboard.slice(0, 10);

        updateLevelTitle();
        saveGameState();

        this.navigateTo('results', {
            scenario: s,
            overallScore: overallScore,
            xpEarned: xpEarned,
            avgScores: avgScores,
            trust: currentSession.trustStore,
            history: currentSession.callHistory,
            decisionLog: currentSession.decisionLog,
            mode: currentSession.mode
        });
    },

    /* ==========================================================================
       CHOICE-SPECIFIC RESULTS & COACHING
       ========================================================================== */
    renderResultsHTML(param) {
        const { scenario, overallScore, xpEarned, avgScores, trust, history, decisionLog, mode } = param;

        let reviewHTML = '';
        if (decisionLog && decisionLog.length > 0) {
            reviewHTML = decisionLog.map((dec, idx) => `
                <div style="background: var(--bg-tertiary); padding: 10px; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 0.82rem;">
                    <div style="font-weight: 600; color: var(--accent-cyan); margin-bottom: 2px;">Decision ${idx + 1}: ${dec.stepPrompt}</div>
                    <div style="color: var(--text-main); font-style: italic; margin-bottom: 4px;">You chose: "${dec.choiceText}"</div>
                    <div style="color: var(--text-muted);"><strong>Coaching analysis:</strong> ${dec.feedback}</div>
                </div>
            `).join('');
        } else {
            reviewHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">No recorded decisions.</p>`;
        }

        return `
            <div class="card results-card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Call Performance Review</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">${scenario.title} (${mode === 'challenge' ? 'Challenge Mode' : 'Guided Mode'})</p>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 1.25rem; font-weight: 700; color: var(--accent-emerald);">+${xpEarned} XP</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">Earned</div>
                    </div>
                </div>

                <div style="text-align: center; background: var(--bg-secondary); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                    <div style="font-size: 2rem; font-weight: 800; color: ${overallScore >= 80 ? 'var(--accent-emerald)' : overallScore >= 60 ? 'var(--accent-amber)' : 'var(--accent-rose)'};">${overallScore}%</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Overall Call Performance Score • Customer Trust: ${trust}%</div>
                </div>

                <div class="score-grid">
                    <div class="score-box">
                        <div class="s-label">Empathy</div>
                        <div class="s-value" style="color: var(--accent-cyan);">${avgScores.empathy}%</div>
                    </div>
                    <div class="score-box">
                        <div class="s-label">Acknowledgement</div>
                        <div class="s-value" style="color: var(--accent-indigo);">${avgScores.acknowledgement}%</div>
                    </div>
                    <div class="score-box">
                        <div class="s-label">Ownership</div>
                        <div class="s-value" style="color: var(--accent-emerald);">${avgScores.ownership}%</div>
                    </div>
                    <div class="score-box">
                        <div class="s-label">Technical</div>
                        <div class="s-value" style="color: var(--accent-amber);">${avgScores.technical}%</div>
                    </div>
                    <div class="score-box">
                        <div class="s-label">Safety</div>
                        <div class="s-value" style="color: ${avgScores.safety >= 90 ? 'var(--accent-emerald)' : 'var(--accent-rose)'};">${avgScores.safety}%</div>
                    </div>
                    <div class="score-box">
                        <div class="s-label">Reassurance</div>
                        <div class="s-value" style="color: var(--accent-cyan);">${avgScores.reassurance}%</div>
                    </div>
                </div>

                <div class="feedback-section">
                    <h4>🔍 Choice-Specific Coaching Breakdown</h4>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px;">Here is how each decision you made impacted your score and customer trust:</p>
                    ${reviewHTML}
                </div>

                <div class="feedback-section">
                    <h4>📜 Call Transcript Timeline</h4>
                    <div style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
                        ${history.map(h => `
                            <div style="background: var(--bg-tertiary); padding: 8px 10px; border-radius: var(--radius-sm); font-size: 0.8rem;">
                                <strong style="color: ${h.speaker === 'customer' ? 'var(--accent-amber)' : 'var(--accent-cyan)'}; text-transform: uppercase; font-size: 0.7rem;">${h.speaker}:</strong>
                                <p style="margin-top: 2px; color: var(--text-main);">${h.text}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn btn-secondary" onclick="app.startScenario('${scenario.id}', '${mode}')">Play Again</button>
                    <button class="btn btn-primary" onclick="app.navigateTo('dashboard')">Return to Dashboard</button>
                </div>
            </div>
        `;
    },

    /* ==========================================================================
       PHRASE MEMORY MODULE (Protected XP & Replay Logic)
       ========================================================================== */
    renderPhraseMemoryHTML() {
        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Phrase Memory Training</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Internalize communication framework patterns (Acknowledge → Empathize → Reassure → Ownership → Act).</p>
                    </div>
                    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="app.navigateTo('dashboard')">Back</button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 10px;" id="phrase-exercises-container">
                    ${PHRASE_MEMORY_EXERCISES.map((ex, idx) => {
                        const isCompleted = gameState.phraseMemoryCompleted[ex.id];
                        return `
                            <div class="phrase-card" id="${ex.id}">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--accent-indigo); text-transform: uppercase;">Exercise ${idx + 1} • ${ex.category}</span>
                                    <span style="font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: ${isCompleted ? 'rgba(16, 185, 129, 0.2)' : 'rgba(99, 102, 241, 0.2)'}; color: ${isCompleted ? 'var(--accent-emerald)' : 'var(--accent-indigo)'}; font-weight: 600;">
                                        ${isCompleted ? 'Completed ✓' : 'New (+25 XP)'}
                                    </span>
                                </div>
                                <div style="font-size: 0.85rem; font-style: italic; color: var(--text-muted); margin-bottom: 8px;">Customer: "${ex.customerStatement}"</div>
                                <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 10px;">${ex.prompt}</div>
                                <div style="display: flex; flex-direction: column; gap: 6px;" id="choices-${ex.id}">
                                    ${ex.choices.map((c, cIdx) => `
                                        <button class="btn btn-secondary" style="text-align: left; justify-content: flex-start; font-size: 0.82rem; padding: 10px 14px;" onclick="app.submitPhraseAnswer('${ex.id}', ${cIdx})">
                                            ${c.text}
                                        </button>
                                    `).join('')}
                                </div>
                                <div id="feedback-${ex.id}" style="margin-top: 10px; font-size: 0.8rem; display: none;"></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    },

    submitPhraseAnswer(exerciseId, choiceIndex) {
        const ex = PHRASE_MEMORY_EXERCISES.find(e => e.id === exerciseId);
        const choice = ex.choices[choiceIndex];
        const isBest = choice.score >= 100;

        const feedbackEl = document.getElementById(`feedback-${exerciseId}`);
        feedbackEl.style.display = 'block';
        feedbackEl.style.padding = '10px';
        feedbackEl.style.borderRadius = 'var(--radius-sm)';
        feedbackEl.style.background = isBest ? 'rgba(16, 185, 129, 0.15)' : 'rgba(244, 63, 94, 0.15)';
        feedbackEl.style.border = isBest ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(244, 63, 94, 0.3)';
        feedbackEl.innerHTML = `<strong>${isBest ? '✅ Optimal Response' : '⚠️ Sub-optimal Response'}</strong><br>${choice.feedback}`;

        if (isBest && !gameState.phraseMemoryCompleted[exerciseId]) {
            gameState.phraseMemoryCompleted[exerciseId] = true;
            gameState.xp += 25;
            updateLevelTitle();
            saveGameState();
            this.renderHeaderStats();

            const card = document.getElementById(exerciseId);
            const badge = card.querySelector('span');
            badge.innerText = 'Completed ✓';
            badge.style.background = 'rgba(16, 185, 129, 0.2)';
            badge.style.color = 'var(--accent-emerald)';
        }
    },

    renderLeaderboardHTML() {
        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Local Leaderboard</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Stored locally on this device/browser.</p>
                    </div>
                    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="app.navigateTo('dashboard')">Back</button>
                </div>

                <div style="overflow-x: auto; margin-top: 10px;">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Advisor</th>
                                <th>Score</th>
                                <th>XP</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${gameState.leaderboard.map((entry, idx) => `
                                <tr>
                                    <td>#${idx + 1}</td>
                                    <td><strong>${entry.name}</strong></td>
                                    <td>${entry.score}%</td>
                                    <td>${entry.xp}</td>
                                    <td>${entry.date}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    },

    renderProgressHTML() {
        const completedCount = Object.keys(gameState.completedScenarios).length;
        const totalScenarios = SCENARIOS.length;
        const pmCompletedCount = Object.keys(gameState.phraseMemoryCompleted).length;

        return `
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Advisor Progress</div>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Training metrics and milestones.</p>
                    </div>
                    <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.75rem;" onclick="app.navigateTo('dashboard')">Back</button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 10px;">
                    <div class="stat-card">
                        <div class="label">Current Rank Title</div>
                        <div class="value" style="color: var(--accent-amber);">${gameState.levelTitle}</div>
                    </div>

                    <div class="stat-card">
                        <div class="label">Total Accumulated XP</div>
                        <div class="value" style="color: var(--accent-cyan);">${gameState.xp} XP</div>
                    </div>

                    <div class="stat-card">
                        <div class="label">Scenarios Completed</div>
                        <div class="value">${completedCount} / ${totalScenarios} (${Math.round((completedCount / totalScenarios) * 100)}%)</div>
                    </div>

                    <div class="stat-card">
                        <div class="label">Phrase Memory Completed</div>
                        <div class="value">${pmCompletedCount} / ${PHRASE_MEMORY_EXERCISES.length}</div>
                    </div>
                </div>
            </div>
        `;
    }
};

document.addEventListener('DOMContentLoaded', () => {
    app.init();
});
</script>
</body>
</html>

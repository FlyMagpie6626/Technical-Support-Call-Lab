<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Support Call Lab (TSCL) 2.2</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 850px;
        }
        @media (min-width: 500px) {
            .container {
                height: 85vh;
            }
        }
        header {
            padding: 16px;
            background: #090d16;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.1rem;
            margin: 0;
            color: #60a5fa;
            font-weight: 600;
        }
        .badge {
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            width: 100%;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
        }
        .choice-btn {
            background: #273548;
            border: 1px solid var(--border);
            color: var(--text-color);
            text-align: left;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .choice-btn:hover:not(:disabled) {
            background: #334155;
            border-color: var(--primary);
        }
        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .chat-bubble {
            background: #273548;
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .chat-bubble.customer {
            align-self: flex-start;
            border-left: 3px solid var(--primary);
        }
        .chat-bubble.advisor {
            align-self: flex-end;
            background: #1d4ed8;
        }
        .panel {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .hidden {
            display: none !important;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Tech Support Call Lab</h1>
            <span class="badge" id="app-version">TSCL 2.2 (Stage 1)</span>
        </header>
        
        <div class="content" id="main-content">
            <!-- Main menu view loaded dynamically -->
        </div>
    </div>

    <script>
        /**
         * TSCL 2.2 — Stage 1 Runtime Score Sanitization Helper
         * Replaces artificial defaults (Safety: 80, Clarity: 85) with strict 0-100 boundary checks.
         */
        function getValidScore(val) {
            if (typeof val !== 'number' || !Number.isFinite(val) || val < 0 || val > 100) {
                return 0; // Safe fallback: 0 points awarded for invalid/missing data
            }
            return val;
        }

        function extractChoiceScores(choice) {
            const scoresObj = choice && choice.scores ? choice.scores : {};
            return {
                empathy: getValidScore(scoresObj.empathy),
                acknowledgement: getValidScore(scoresObj.acknowledgement),
                reassurance: getValidScore(scoresObj.reassurance),
                ownership: getValidScore(scoresObj.ownership),
                technical_accuracy: getValidScore(scoresObj.technical_accuracy),
                safety: getValidScore(scoresObj.safety),
                clarity: getValidScore(choice ? choice.clarity : undefined) // Preserves root-level choice.clarity structure
            };
        }

        // Application State & Storage
        let userStats = JSON.parse(localStorage.getItem('tscl_progress')) || { xp: 0, streak: 0, completedScenarios: [] };
        let currentSession = { scenario: null, currentNode: null, totalChoicesMade: 0, scores: { empathy: 0, acknowledgement: 0, reassurance: 0, ownership: 0, technical_accuracy: 0, safety: 0, clarity: 0 } };

        function saveProgress() {
            localStorage.setItem('tscl_progress', JSON.stringify(userStats));
        }

        // Dummy Scenarios & Engine initialization for single-file completeness
        const scenarios = [
            {
                id: "scen_01",
                title: "Printer Connection Trouble",
                category: "Hardware",
                difficulty: "Beginner",
                personality: "Frustrated",
                xpReward: 100,
                nodes: {
                    "node_start": {
                        text: "Customer: My printer won't connect to my Wi-Fi at all! I've tried everything!",
                        choices: [
                            {
                                text: "I understand how frustrating printer issues can be. Let's get this resolved together step by step.",
                                nextNode: "node_step1",
                                clarity: 90,
                                scores: { empathy: 95, acknowledgement: 90, reassurance: 85, ownership: 90, technical_accuracy: 80, safety: 90 }
                            },
                            {
                                text: "Did you turn it off and on again?",
                                nextNode: "node_step1",
                                clarity: 50,
                                scores: { empathy: 30, acknowledgement: 40, reassurance: 30, ownership: 50, technical_accuracy: 60, safety: 70 }
                            }
                        ]
                    },
                    "node_step1": {
                        text: "Customer: Okay, I restarted it. What's next?",
                        isTerminal: true,
                        outcome: "success",
                        choices: []
                    }
                }
            }
        ];

        function renderMainMenu() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div style="text-align: center; margin: auto 0;">
                    <h2 style="color: #60a5fa; margin-bottom: 8px;">Support Training Simulator</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">Practice customer interactions, technical troubleshooting, and communication dimensions with QA validation.</p>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${userStats.xp}</div>
                            <div class="stat-label">Total XP</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${userStats.streak}</div>
                            <div class="stat-label">Streak</div>
                        </div>
                    </div>
                    <button class="btn" onclick="startScenario('scen_01')">Start Training Scenario</button>
                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="renderQAPanel()">Developer QA & Defect Tests</button>
                </div>
            `;
        }

        function startScenario(id) {
            const scen = scenarios.find(s => s.id === id);
            currentSession = {
                scenario: scen,
                currentNode: 'node_start',
                totalChoicesMade: 0,
                scores: { empathy: 0, acknowledgement: 0, reassurance: 0, ownership: 0, technical_accuracy: 0, safety: 0, clarity: 0 }
            };
            renderScene();
        }

        function renderScene() {
            const scen = currentSession.scenario;
            const node = scen.nodes[currentSession.currentNode];
            const container = document.getElementById('main-content');
            
            if (node.isTerminal) {
                userStats.xp += scen.xpReward;
                userStats.streak++;
                saveProgress();
                container.innerHTML = `
                    <div style="text-align: center; margin: auto 0;">
                        <h2 style="color: var(--accent);">Scenario Completed!</h2>
                        <p>You successfully resolved the customer issue.</p>
                        <p style="color: #60a5fa; font-weight: bold;">+${scen.xpReward} XP Awarded</p>
                        <button class="btn" onclick="renderMainMenu()">Return to Menu</button>
                    </div>
                `;
                return;
            }

            let choicesHtml = node.choices.map((c, idx) => `
                <button class="choice-btn" onclick="makeChoice(${idx})">${c.text}</button>
            `).join('');

            container.innerHTML = `
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Scenario: ${scen.title}</div>
                <div class="chat-bubble customer">${node.text}</div>
                <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">Select your response:</div>
                    ${choicesHtml}
                </div>
            `;
        }

        function makeChoice(idx) {
            const node = currentSession.scenario.nodes[currentSession.currentNode];
            const choice = node.choices[idx];
            
            // Extract and accumulate sanitized scores
            const extracted = extractChoiceScores(choice);
            currentSession.totalChoicesMade++;
            for (let dim in extracted) {
                currentSession.scores[dim] += extracted[dim];
            }

            currentSession.currentNode = choice.nextNode;
            renderScene();
        }

        /**
         * Developer QA Validation Engine — Stage 1 7-Dimensional Schema Validation
         */
        function validateChoiceScoring(scenarioId, nodeId, choiceIndex, choice) {
            const errors = [];
            const scores = choice ? choice.scores : null;

            if (!scores || typeof scores !== 'object') {
                errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: Missing 'scores' object.`);
                return errors;
            }

            const nestedDimensions = ['empathy', 'acknowledgement', 'reassurance', 'ownership', 'technical_accuracy', 'safety'];
            nestedDimensions.forEach(dim => {
                const val = scores[dim];
                if (val === undefined || val === null) {
                    errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: Missing '${dim}' score.`);
                } else if (typeof val !== 'number' || !Number.isFinite(val)) {
                    errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: '${dim}' must be a finite number (got ${val}).`);
                } else if (val < 0 || val > 100) {
                    errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: '${dim}' out of range [0-100] (got ${val}).`);
                }
            });

            const clarityVal = choice.clarity;
            if (clarityVal === undefined || clarityVal === null) {
                errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: Missing root-level 'clarity' score.`);
            } else if (typeof clarityVal !== 'number' || !Number.isFinite(clarityVal)) {
                errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: 'clarity' must be a finite number (got ${clarityVal}).`);
            } else if (clarityVal < 0 || clarityVal > 100) {
                errors.push(`[Critical] Scenario ${scenarioId}, Node ${nodeId}, Choice ${choiceIndex}: 'clarity' out of range [0-100] (got ${clarityVal}).`);
            }

            return errors;
        }

        function runDeveloperQA() {
            let allErrors = [];
            scenarios.forEach(scen => {
                for (let nodeId in scen.nodes) {
                    const node = scen.nodes[nodeId];
                    if (node.choices) {
                        node.choices.forEach((ch, idx) => {
                            const errs = validateChoiceScoring(scen.id, nodeId, idx, ch);
                            allErrors = allErrors.concat(errs);
                        });
                    }
                }
            });
            return allErrors;
        }

        /**
         * Isolated Defect-Injection Test Runner (Stage 1)
         */
        function runStage1DefectInjectionTests() {
            const testCases = [
                { id: 1, name: "Missing safety score", data: { clarity: 80, scores: { empathy: 80, acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80 } }, expectValid: false },
                { id: 2, name: "Missing clarity score", data: { scores: { empathy: 80, acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 3, name: "Missing empathy score", data: { clarity: 80, scores: { acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 4, name: "String score ('high')", data: { clarity: 80, scores: { empathy: "high", acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 5, name: "NaN score", data: { clarity: 80, scores: { empathy: NaN, acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 6, name: "Infinity score", data: { clarity: 80, scores: { empathy: Infinity, acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 7, name: "Negative score (-10)", data: { clarity: 80, scores: { empathy: -10, acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 8, name: "Score > 100 (105)", data: { clarity: 80, scores: { empathy: 105, acknowledgement: 80, reassurance: 80, ownership: 80, technical_accuracy: 80, safety: 80 } }, expectValid: false },
                { id: 9, name: "Valid score of 0", data: { clarity: 0, scores: { empathy: 0, acknowledgement: 0, reassurance: 0, ownership: 0, technical_accuracy: 0, safety: 0 } }, expectValid: true },
                { id: 10, name: "Valid score of 100", data: { clarity: 100, scores: { empathy: 100, acknowledgement: 100, reassurance: 100, ownership: 100, technical_accuracy: 100, safety: 100 } }, expectValid: true },
                { id: 11, name: "Valid complete record", data: { clarity: 85, scores: { empathy: 90, acknowledgement: 85, reassurance: 80, ownership: 95, technical_accuracy: 100, safety: 100 } }, expectValid: true },
                { 
                    id: 12, 
                    name: "Invalid runtime choice does not contaminate accumulator", 
                    runRuntimeCheck: () => {
                        const malformedChoice = { clarity: "invalid", scores: { empathy: null, safety: undefined } };
                        const extracted = extractChoiceScores(malformedChoice);
                        return Object.values(extracted).every(v => typeof v === 'number' && Number.isFinite(v) && v === 0);
                    },
                    expectValid: true 
                }
            ];

            let passedCount = 0;
            const testResults = testCases.map(tc => {
                if (tc.runRuntimeCheck) {
                    const pass = tc.runRuntimeCheck();
                    if (pass) passedCount++;
                    return { id: tc.id, name: tc.name, status: pass ? 'PASS' : 'FAIL' };
                }
                const errs = validateChoiceScoring('TEST_SCENARIO', 'NODE_1', 0, tc.data);
                const isValid = errs.length === 0;
                const pass = isValid === tc.expectValid;
                if (pass) passedCount++;
                return { id: tc.id, name: tc.name, status: pass ? 'PASS' : 'FAIL' };
            });

            return testResults;
        }

        function renderQAPanel() {
            const qaErrors = runDeveloperQA();
            const defectResults = runStage1DefectInjectionTests();
            const container = document.getElementById('main-content');

            let errorsHtml = qaErrors.length === 0 ? '<p style="color: var(--accent);">All authored scenarios passed 7-dimensional validation!</p>' : qaErrors.map(e => `<p style="color: var(--danger); font-size: 0.85rem;">${e}</p>`).join('');
            let testsHtml = defectResults.map(t => `<div style="display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid var(--border);"><span>#${t.id}: ${t.name}</span><span style="color: ${t.status === 'PASS' ? 'var(--accent)' : 'var(--danger)'}; font-weight: bold;">${t.status}</span></div>`).join('');

            container.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 12px; height: 100%;">
                    <h3 style="margin: 0; color: #60a5fa;">Developer QA & Defect Engine</h3>
                    <div class="panel" style="max-height: 140px; overflow-y: auto;">
                        <h4 style="margin: 0 0 8px 0; font-size: 0.9rem;">Scenario Validation Status</h4>
                        ${errorsHtml}
                    </div>
                    <div class="panel" style="flex: 1; overflow-y: auto;">
                        <h4 style="margin: 0 0 8px 0; font-size: 0.9rem;">Stage 1 Defect-Injection Tests (12/12)</h4>
                        ${testsHtml}
                    </div>
                    <button class="btn btn-secondary" onclick="renderMainMenu()">Back to Menu</button>
                </div>
            `;
        }

        // Initialize App on load
        window.onload = function() {
            renderMainMenu();
        };
    </script>
</body>
</html>
